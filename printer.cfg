position_max: 250
position_min: -2

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.6
interpolate: True
# stealthchop_threshold: 999999

[autotune_tmc stepper_z]
