dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
# endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_max: 244
homing_speed: 20
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.75
interpolate: True
# stealthchop_threshold: 999999

[autotune_tmc stepper_x]
motor: creality-42-34
tuning_goal: silent
voltage: 24

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 220
homing_speed: 50

[tmc2209 stepper_y]
# uart_pin: blue:PA9
# uart_address: 3
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.75
interpolate: True
# stealthchop_threshold: 999999

[autotune_tmc stepper_y]
motor: creality-42-34
tuning_goal: silent
voltage: 24

[stepper_z]
