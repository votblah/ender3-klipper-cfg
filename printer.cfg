tx_pin: PC10
uart_address: 3
run_current: 0.6
interpolate: True
# stealthchop_threshold: 999999

[autotune_tmc stepper_z1]
motor: creality-42-34
tuning_goal: auto
voltage: 24

[extruder]
step_pin: ebb:PD0
dir_pin: ebb:PD1
enable_pin: !ebb:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.73
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_velocity: 120
max_extrude_only_accel: 6000
heater_pin: ebb:PB13
# sensor_type: EPCOS 100K B57560G104F
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: ebb:PA3
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 10
max_temp: 280
pressure_advance: 0.04

[tmc2209 extruder]
uart_pin: ebb:PA15
run_current: 0.80
sense_resistor: 0.11
interpolate: True
# stealthchop_threshold: 999999

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg
tuning_goal: performance
voltage: 24

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 10
max_temp: 120

[static_digital_output ebb_power]
pins: PC8

[heater_fan heatbreak_cooling_fan]
pin: ebb:PA1

[controller_fan controller_fan]
pin: PB15
cycle_time: 0.001
hardware_pwm: True
kick_start_time: 1.0
fan_speed: 0.7
idle_timeout: 60
idle_speed: 0.5
stepper: stepper_x, stepper_y, stepper_z1, stepper_z
heater: extruder

[fan]
pin: ebb:PA0
off_below: 0.3

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_340011001850425938323120-if00

[input_shaper]
shaper_freq_x: 43.8
shaper_type_x: mzv
shaper_freq_y: 38.2
shaper_type_y: mzv

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 2600
max_z_velocity: 5
max_z_accel: 100

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

