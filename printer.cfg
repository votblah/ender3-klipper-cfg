# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]

[exclude_object]

[mcu eddy]
# serial: /dev/serial/by-id/usb-Klipper_rp2040_50445061188EB91C-if00
canbus_uuid: a29a0a50c970
# restart_method: command

[mcu blue]
# serial: /tmp/klipper_host_mcu
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_48FF6C064884575414190387-if00 
restart_method: command

[mcu ebb]
canbus_uuid: cad4c4fbeb84

# [mpu9250]
# i2c_mcu: blue
# i2c_bus: i2c1
# i2c_speed: 400000

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100
 
[temperature_sensor chamber_temp]
sensor_type: BME280
i2c_mcu: blue
i2c_bus: i2c1
i2c_address: 119

[temperature_sensor raspberry_temp]
sensor_type: temperature_host

[temperature_sensor SKR_temp]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor Blue_temp]
sensor_type: temperature_mcu
sensor_mcu: blue

[temperature_sensor btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26

[adxl345 hotend]
cs_pin: ebb:PB12
spi_software_sclk_pin: ebb:PB10
spi_software_mosi_pin: ebb:PB11
spi_software_miso_pin: ebb:PB2

[adxl345 bed]
cs_pin: blue:PB12
spi_bus: spi2

[resonance_tester]
accel_chip_x: adxl345 hotend
accel_chip_y: adxl345 bed
# accel_chip: adxl345
probe_points:
    100, 100, 20

[pause_resume]

# Uncomment this if you are using Eddy as the probe AND the homing endstop AND would like to use the beta z-offset control
[save_variables]
filename: ~/printer_data/config/variables.cfg

# Uncomment this if you are using Eddy as the probe AND the homing endstop
[force_move]
enable_force_move: True # Allows a user to move the z axis down if they have no other means of homing Z and need to calibrate the Eddy.

[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state

[gcode_macro LOAD_FILAMENT]
variable_load_distance:  50
variable_purge_distance:  25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=load_state
    G91
    G92 E0
    G1 E{load_distance} F{max_velocity} # fast-load
    G1 E{purge_distance} F{speed} # purge
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance:  50
variable_purge_distance:  25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    G92 E0
    G1 E{purge_distance} F{speed} # purge
    G1 E-{unload_distance} F{max_velocity} # fast-unload
    RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(62)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    # Next line is needed for adaptive mesh to work
    # EXCLUDE_OBJECT_DEFINE
    # Home the printer
    G28
    # Start heating nozzle to 150 deg. for probing
    M104 S150
    # Wait for bed to reach temperature
    M190 S{BED_TEMP}
    # Run Z tilt adjust
    Z_TILT_ADJUST
    # Use absolute coordinates
    G90
    # Go to center
    G1 X120 Y115 Z15
    # Wait 30 sec for nozzle clean
    G4 P30000
    # Do tap
    PROBE_EDDY_NG_TAP
    # Run bed mesh calibration
    # BED_MESH_CLEAR
    # BED_MESH_CALIBRATE ADAPTIVE=1
    BED_MESH_PROFILE LOAD=default
    # BED_MESH_CALIBRATE METHOD=rapid_scan
    # BED_MESH_CALIBRATE
    # Go to center
    # G1 X162.3 Y123 Z5
    # Recalibrate Z
    # G28 Z
    # Move the nozzle near the bed
    G1 X0.1 Y20 Z5 F3000
    # Set and wait for nozzle to reach temperature
    M109 S{EXTRUDER_TEMP}
    # Prime lines
    G1 X0.1 Y20 Z0.3 F3000.0
    G1 X0.1 Y200.0 Z0.3 F1500.0 E15
    G1 X0.8 Y200.0 Z0.3 F3000.0 ; Move to side a little
    G1 X0.8 Y20 Z0.3 F1500.0 E30 ; Draw the second line
    G1 Z0.4

[gcode_macro END_PRINT]
gcode:
    # Move nozzle away from print while retracting
    G91
    G1 X-2 Y-2 E-3 F300
    # Turn off bed, extruder, and fan
    M140 S0
    M104 S0
    M106 S0
    # Raise nozzle by 10mm
    G1 Z10 F3000
    # Absolute positioning
    G90
    # Present print
    G1 X0 Y220
    # Clear TAP offsets
    PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0
    # Disable steppers
    M84

[gcode_arcs]

# [bltouch]
# sensor_pin: ^ebb:PA5
# control_pin: ebb:PA4
# samples: 1
# x_offset: -57.4
# y_offset: -8
# z_offset: 2.6

[probe_eddy_ng btt_eddy]
sensor_type: btt_eddy
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: -57.4
y_offset: -8

[safe_z_home]
home_xy_position: 177.4, 123.8
speed: 50
z_hop: 10                 # Move up 10mm
z_hop_speed: 5

[z_tilt]
z_positions: -30, 115
             256, 115
points: 86, 115
        242, 115
speed: 100
horizontal_move_z: 2
retries: 20
retry_tolerance: 0.006

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
# endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_max: 244
homing_speed: 20
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.75
interpolate: True
# stealthchop_threshold: 999999

[autotune_tmc stepper_x]
motor: creality-42-34
tuning_goal: silent
voltage: 24

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 220
homing_speed: 50

[tmc2209 stepper_y]
# uart_pin: blue:PA9
# uart_address: 3
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.75
interpolate: True
# stealthchop_threshold: 999999

[autotune_tmc stepper_y]
motor: creality-42-34
tuning_goal: silent
voltage: 24

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
# position_endstop: 0.0
position_max: 250
position_min: -2

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.6
interpolate: True
# stealthchop_threshold: 999999

[autotune_tmc stepper_z]
motor: creality-42-34
tuning_goal: auto
voltage: 24

[stepper_z1]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.6
interpolate: True
# stealthchop_threshold: 999999

[autotune_tmc stepper_z1]
motor: creality-42-34
tuning_goal: auto
voltage: 24

[extruder]
step_pin: ebb:PD0
dir_pin: ebb:PD1
enable_pin: !ebb:PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.73
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_velocity: 120
max_extrude_only_accel: 6000
heater_pin: ebb:PB13
# sensor_type: EPCOS 100K B57560G104F
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: ebb:PA3
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 10
max_temp: 280
pressure_advance: 0.04

[tmc2209 extruder]
uart_pin: ebb:PA15
run_current: 0.80
sense_resistor: 0.11
interpolate: True
# stealthchop_threshold: 999999

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg
tuning_goal: performance
voltage: 24

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 10
max_temp: 120

[static_digital_output ebb_power]
pins: PC8

[heater_fan heatbreak_cooling_fan]
pin: ebb:PA1

[controller_fan controller_fan]
pin: PB15
cycle_time: 0.001
hardware_pwm: True
kick_start_time: 1.0
fan_speed: 0.7
idle_timeout: 60
idle_speed: 0.5
stepper: stepper_x, stepper_y, stepper_z1, stepper_z
heater: extruder

[fan]
pin: ebb:PA0
off_below: 0.3

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_340011001850425938323120-if00

[input_shaper]
#shaper_freq_x: 43.8
#shaper_type_x: mzv
shaper_freq_y: 38.2
shaper_type_y: mzv

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 2600
max_z_velocity: 5
max_z_accel: 100

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

# See the sample-lcd.cfg file for definitions of common LCD displays.

[display]
lcd_type: emulated_st7920
spi_software_miso_pin: PD8 # status led, Virtual MISO
spi_software_mosi_pin: PD6
spi_software_sclk_pin: PB9
en_pin: PB8
encoder_pins: ^PA10, ^PA9
click_pin: ^!PA15

[output_pin beeper]
pin: PB5

[bed_screws]
screw1: 31, 36
screw2: 201, 36
screw3: 201, 206
screw4: 31, 206

[screws_tilt_adjust]
screw1: 88.4, 217
screw1_name: rear left screw
screw2: 244, 217
screw2_name: rear right screw
screw3: 88.4, 47
screw3_name: front left screw
screw4: 244, 47
screw4_name: front right screw
screw_thread: CW-M4

[bed_mesh]
speed: 80
horizontal_move_z: 2.0
mesh_min: 26,26
mesh_max: 180,200
probe_count: 7,7
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

[neopixel my_neopixel]
pin: PA8
chain_count: 18
initial_RED: 0.3

