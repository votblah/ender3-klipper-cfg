speed: 50
z_hop: 10                 # Move up 10mm
z_hop_speed: 5

[z_tilt]
z_positions: -30, 115
             256, 115
points: 86, 115
        242, 115
speed: 100
horizontal_move_z: 4
retries: 20
retry_tolerance: 0.006

[stepper_x]
